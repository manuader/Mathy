# Escenas de Manim de Mathy. DATA. La prosa que explica este archivo está en I0-mapping.md.
#
# Reglas:
# - `families`: una por mecánica de ../E-mecanicas/mechanics.yaml (13). `mechanic` es el id de la mecánica;
#   `base_primitives` son los nombres de ManimGL que toda escena de la familia hereda de su clase base.
# - `scenes`: cada escena que un nodo del grafo declara en su campo `manim` (92 ids congelados) más las
#   escenas agregadas por I (marcadas con `added_by_i: true`). Los ids son permanentes.
# - `primitives`: SOLO nombres confirmados en el código fuente de ManimGL (3b1b/manim). El validador
#   los compara contra el inventario de I0-mapping.md §8 y rechaza cualquier nombre de ManimCE.
# - `native_equivalents`: ids del mini-Manim nativo (viz-core, ../O-arquitectura-tecnica.md §3),
#   tomados de `native_vocabulary` más abajo.
# - `route`: prerender | native | both. `prerender` = clip de 3–10 s renderizado en CI, sin interacción.
#   `native` = corre en viz-core en el dispositivo. `both` = clip de introducción con handoff.json a la
#   escena nativa del mismo id. Equivale al campo `route: nativo | pre-render` de O: native → nativo,
#   prerender → pre-render, both → pre-render (clip) + nativo (escena).
# - `params`: lista "nombre: Tipo" con los tipos de `param_types`. Ningún parámetro contiene texto
#   visible; las etiquetas se resuelven por clave de locale en la app (../P-internacionalizacion.md).
# - `text_free`: true en toda escena. Un clip con símbolos universales embebidos declararía
#   `text_free: false` más `embedded_symbols: [...]` (P §7); ninguna escena de esta versión lo necesita.
# - `duration_s`: solo en prerender y both (duración del clip). `threed`: true solo si el clip usa
#   ThreeDScene con cámara real. Ninguna escena de la espina lo necesita; las escenas 3D interactivas
#   quedan restringidas a la lista de espera de ../D-curriculum/D0-mapa.md.
# - Este archivo no contiene texto visible al usuario.

version: 1

native_vocabulary:
  # Mobjects de viz-core (O §3). ConcreteToken = ficha iconográfica (fruta, cofre, llave) con la caja
  # del símbolo al que morfa (O §4). SvgAsset = asset propio estático sin ids internos.
  - Group
  - Line
  - Arrow
  - Vector
  - Dot
  - Circle
  - Arc
  - Angle
  - Polygon
  - Brace
  - DecimalNumber
  - NumberLine
  - Axes
  - NumberPlane
  - ComplexPlane
  - ThreeDAxes
  - FunctionGraph
  - RiemannRects
  - AreaUnderGraph
  - TangentLineAt
  - VectorField
  - StreamLines
  - MatrixMobject
  - SurfaceWire
  - TracedPath
  - BarChart
  - MathMobject
  - Text
  - ConcreteToken
  - SvgAsset
  # Animaciones (O §3, tabla). Tween cubre ApplyMethod, ScaleInPlace, FadeToColor, Swap,
  # ChangeDecimalToValue y Restore (interpolación de propiedades hacia un estado guardado).
  - Transform
  - TransformMatchingIds
  - Write
  - FadeIn
  - FadeOut
  - Indicate
  - Flash
  - CircleIndicate
  - PassingFlash
  - Wiggle
  - LaggedStart
  - Succession
  - MoveAlongPath
  - Rotate
  - Tween
  # Motor
  - SharedValue
  - AlwaysRedraw
  - GridDeform
  - Projection2_5D
  - Timeline
  - RateFunctions

param_types:
  - int
  - float
  - bool
  - MathTree        # árbol MathJSON con ids estables (O §4)
  - NodeId          # id de un nodo del MathTree
  - IdMap           # correspondencia NodeId → NodeId entre dos MathTree (morph)
  - Op              # add | sub | mul | div | pow | root | exp | log | neg
  - Fn              # función de una variable como MathTree
  - Rule            # regla de derivación: sum | const_mult | power | chain | product
  - Point           # [x, y]
  - Vector2         # [x, y]
  - Matrix2         # [[a, b], [c, d]]
  - Interval        # [a, b]
  - Angle           # radianes
  - Ratio           # [num, den]
  - Segment         # [Point, Point]
  - Edge            # [i, j] índices de nodos
  - Graph           # lista de aristas Edge sobre n nodos
  - Composition     # conteo por color: int[]
  - TilingId        # id de un despiece de baldosas predefinido
  - Side            # lhs | rhs
  - Seed            # semilla determinista del generador aleatorio
  - "int[]"
  - "float[]"
  - "float[][]"
  - "Op[]"
  - "Rule[]"
  - "Point[]"
  - "Vector2[]"
  - "MathTree[]"
  - "NodeId[]"
  - "Segment[]"
  - "Edge[]"
  - "Composition[]"

families:
