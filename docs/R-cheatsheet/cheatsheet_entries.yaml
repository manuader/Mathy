# Entradas de cheatsheet de Mathy. DATA, sin texto visible: título y cuerpo viven en
# ../locales/es/cheatsheet.yaml bajo cheatsheet.<id>.{title, body}. Prosa en R0-cheatsheet.md.
# Las 535 entradas son las que los nodos del grafo declaran en su campo `cheatsheet`
# (../C-knowledge-graph/graph/*.yaml) y las que citan por id docs/S-desafios/challenges.yaml
# (`cheatsheet_refs`, `hidden_data.uses`), docs/I-manim/scenes.yaml, docs/E-mecanicas/mechanics.yaml,
# docs/G-analogias/analogies.yaml y docs/L-modelo-errores/*.yaml. Este archivo no agrega ni quita
# entradas respecto de ese conjunto: lo describe.
#
# Campos por entrada:
#   id                      cs.<area>.<slug>; el slug nombra la idea, no el nodo
#   node                    el nodo del grafo que declara la entrada en su `cheatsheet`.
#                           Cuando más de un nodo la declara, éste es el de la espina, o si
#                           ambos lo son (o ninguno), el de nivel más bajo; el resto queda en
#                           `also_declared_by`.
#   also_declared_by        opcional; otros nodos que también listan este id en su `cheatsheet`
#   area, cluster           derivados de `node` (area.cluster.slug)
#   kind                    qué tipo de contenido es. Enum cerrado, justificado abajo.
#   display                 { form, scene }. `form` es expression (una expresión matemática),
#                           statement (un enunciado corto, no una expresión) o figure (una
#                           construcción o diagrama es el contenido principal). `scene` es un id
#                           de ../I-manim/scenes.yaml cuando existe una escena real que ilustra
#                           la entrada, o `null`: la mayoría de las entradas no espina no tienen
#                           escena propia y se muestran con el motor de layout o un asset estático.
#   unlocked_at             `symbolic` o `formal`: la primera de esas dos capas del nodo en la
#                           que la entrada aparece. Regla: `notation`, `identity`, `procedure`,
#                           `definition` y `figure` se desbloquean en `symbolic` (nacen con la
#                           notación o el diagrama); `property`, `theorem`, `strategy` y
#                           `constant` se desbloquean en `formal` (piden la condición o la
#                           justificación de esa capa). Excepción: si el nodo tiene nivel 0–2,
#                           la entrada nace en `symbolic` como imagen con voz sin importar su
#                           `kind` (Q §5, N §3.7), y ese `kind` describe el contenido que tendrá
#                           el texto cuando llegue.
#   text_at                 presente solo cuando el nodo tiene nivel 0–2: siempre `formal`, la
#                           capa en la que el texto se agrega debajo de la imagen sin
#                           reemplazarla (Q §5).
#   related                 otros ids `cs.*` de este mismo archivo, temáticamente cercanos
#   replay                  el nodo cuyo minijuego enseña la entrada; el enlace "volver a jugar
#                           esto" resuelve a docs/F-minijuegos/<replay>.md. Coincide con `node`:
#                           lo que se rejuega es siempre el minijuego que originó la entrada.
#   math_locale_sensitive   true cuando la notación de la entrada cambia con el `MathLocale`
#                           (decimales, separador de miles, sen/sin, log/ln, notación de
#                           intervalo, tg/tan, unidades)
#
# Enum de `kind`, nueve valores:
#   identity    una igualdad que vale siempre entre expresiones (a² + b² = c², sen² + cos² = 1)
#   definition  qué es un objeto o una operación (número primo, matriz, límite)
#   procedure   una serie de pasos para llegar a un resultado (división larga, completar el
#               cuadrado, eliminación gaussiana)
#   property    una regla general sobre cómo se comporta una operación o una familia de objetos
#               (conmutatividad, la derivada de una suma, cuándo una serie converge)
#   theorem     un resultado con nombre propio que conecta varias ideas (Pitágoras, Bayes, el
#               teorema fundamental del cálculo, Euler para poliedros)
#   notation    introduce un símbolo o una convención de escritura sin afirmar nada nuevo
#               (f(x), Σ, la notación de intervalo)
#   strategy    una heurística de desafío, no una fórmula: qué construcción probar primero
#               (trazar la altura, buscar el triángulo rectángulo escondido)
#   figure      una construcción o un diagrama es el contenido en sí, sin una fórmula que lo
#               resuma en una línea (una figura de baldosas, un árbol de casos)
#   constant    un valor o una familia de valores especial que vale la pena recordar (e, los
#               ángulos notables, las ternas pitagóricas chicas)
#
# Nada de este archivo es texto visible al jugador: es id, enum, número o referencia a otro id.

version: 1

defaults:
  kinds: [identity, definition, procedure, property, theorem, notation, strategy, figure, constant]
  display_forms: [expression, statement, figure]
  unlock_layers: [symbolic, formal]

