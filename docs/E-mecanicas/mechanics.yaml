# Mecánicas reutilizables de Mathy (13). Ids congelados; los nodos del grafo los referencian en `mechanics`.
# Este archivo no contiene texto visible al usuario: nombres, acción del jugador e invariante narrado
# viven en ../locales/es/mechanics.yaml bajo mechanics.<id>.{name,player_action,invariant}.
# `grammar` usa el enum de ../C-knowledge-graph/schema/node.schema.yaml.
# `reused_by`: ids de nodos. Los de la espina son definitivos; los demás se reconcilian contra graph/*.yaml en la fase 3.
# `areas` se deriva de `reused_by`; el validador exige ≥ 3 áreas por mecánica.
# `fade_steps`: etapas ordenadas de desvanecimiento hacia la notación (ver ../H-progresion-abstraccion.md).
# `manim_family`: familia de escenas; las clases concretas se declaran en ../I-manim/scenes.yaml.

version: 1

