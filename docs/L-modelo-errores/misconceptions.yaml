# Misconceptions de Mathy. Taxonomía abierta: las 19 iniciales del plan más ampliaciones por área.
# Sin texto visible: name y prompt viven en locales/<lang>/misconceptions.yaml
# (misconceptions.<id>.name | misconceptions.<id>.prompt). Prosa, notación de detect y ejemplos
# narrados en L0-taxonomia.md.
#
# Campos por entrada:
#   id        permanente
#   category  sign | wrong_inverse | precedence | conceptual | procedural | notation | invalid_property
#   nodes     nodos donde la regla se evalúa; el primero es el nodo dueño (el que la lista en su YAML)
#   detect    regla buggy {from, to, correct, guard?}. `to` puede ser una lista de resultados;
#             `detect` puede ser una lista de reglas. Notación en L0-taxonomia.md#notacion-de-detect
#   pattern   uno de los 7 ids de explanation_patterns.yaml
#   mechanic  uno de los 12 ids de E-mecanicas/mechanics.yaml; debe estar en mechanics_compatible del patrón
#   severity  1 desliz local · 2 estructural · 3 rompe el invariante central del nodo
#   blocks_ready_after  solo se escribe si difiere del default; hoy ninguna entrada lo hace

version: 1

defaults:
  blocks_ready_after: 3   # ocurrencias dentro de la ventana que bloquean `ready`; ver K-evaluacion.md (única fuente)
  window_items: 10        # tamaño de la ventana de ítems recientes; ver K-evaluacion.md

misconceptions:

  # ---- sign ----------------------------------------------------------------

  - id: sign_flip_on_move
    category: sign
    nodes: [alg.eq.one_step, alg.eq.multi_step, alg.eq.variable_both_sides]
    detect: {from: "x + a = b", to: "x = b + a", correct: "x = b - a"}
    pattern: replay_on_mechanic
    mechanic: balance
    severity: 2

  - id: negative_times_negative
    category: sign
    nodes: [arith.int.negatives, arith.mul.scaling, arith.int.mul_signed]
    detect: {from: "(-a) * (-b)", to: "-(a * b)", correct: "a * b"}
    pattern: double_flip
    mechanic: slope_walker
    severity: 2

  - id: integral_ignores_sign
    category: sign
    nodes: [calc1.int.accumulation, calc1.ftc.integral_undoes_derivative, adv.real.riemann_upper_lower_squeeze, calc1.int.signed_area_below_axis, calc1.int.split_and_scale_properties, calc2.int.area_between, mvcalc.int.double_integral_tank]
    detect: {from: "int[a,b] f", guard: "f < 0 on part of [a,b]", to: "int[a,b] |f|", correct: "int[a,b] f"}
    pattern: replay_on_mechanic
    mechanic: fill_accumulate
    severity: 2

  - id: subtrahend_order_swapped
    category: sign
    nodes: [arith.sub.undo_add]
    detect:
      - {from: "b - a", guard: "b > a", to: "a - b", correct: "b - a"}
      - {from: "x + a = b", guard: "a != b", to: "x = a - b", correct: "x = b - a"}
    pattern: replay_on_mechanic
    mechanic: gears_sequence
    severity: 2

  - id: division_order_swapped
    category: sign
    nodes: [arith.div.undo_mul]
    detect:
      - {from: "a * x = b", guard: "a != b", to: "x = a / b", correct: "x = b / a"}
      - {from: "b / a", guard: "a != b", to: "a / b", correct: "b / a"}
    pattern: key_mismatch
    mechanic: chest_key
    severity: 2

  # ---- wrong_inverse -------------------------------------------------------

  - id: wrong_inverse_choice
    category: wrong_inverse
    nodes: [alg.eq.one_step, prealg.inv.operation_as_key, adv.alg.field_every_nonzero_invertible, arith.div.undo_mul, calc1.ftc.antiderivative_family, calc1.ftc.integral_undoes_derivative, disc.mod.modular_inverse, geom.trans.undo_transformation, linalg.map.inverse_and_systems]
    detect:
      - {from: "a * x = b", to: "x = b - a", correct: "x = b / a"}
      - {from: "x / a = b", to: "x = b / a", correct: "x = b * a"}
    pattern: key_mismatch
    mechanic: chest_key
    severity: 3

  - id: sqrt_loses_negative_branch
    category: wrong_inverse
    nodes: [alg.fn.quadratic_and_sqrt, alg.fn.inverse_function, adv.cplx.i_as_new_axis, adv.cplx.roots_of_unity_polygon, alg.eq.quadratic_roots, linalg.eig.characteristic_polynomial, precalc.cplx.plane_intro, trig.inv.arcsin_two_branches]
    detect: {from: "x^2 = a", guard: "a > 0", to: "x = sqrt(a)", correct: "x = sqrt(a) | x = -sqrt(a)"}
    pattern: double_flip
    mechanic: chest_key
    severity: 2

  # ---- precedence ----------------------------------------------------------

  - id: unwrap_order_inverted
    category: precedence
    nodes: [alg.eq.multi_step, arith.expr.precedence_tree, linalg.sys.elimination_to_echelon]
    detect: {from: "a * x + b = c", to: "x = c / a - b", correct: "x = (c - b) / a"}
    pattern: tree_unwrap
    mechanic: chest_key
    severity: 2

  # ---- conceptual ----------------------------------------------------------

  - id: equals_as_operator
    category: conceptual
    nodes: [prealg.eq.balance, arith.add.displacement]
    detect: {from: "a + b = y + c", to: "y = a + b", correct: "y = a + b - c"}
    pattern: replay_on_mechanic
    mechanic: balance
    severity: 3

  - id: limit_as_reaching
    category: conceptual
    nodes: [precalc.lim.approach, adv.real.epsilon_delta_challenge, calc1.apply.newton_tangent_root, calc1.deriv.rate_as_slope_limit, calc1.int.riemann_refines_to_limit, calc1.lim.continuous_or_not, calc1.lim.epsilon_delta_tolerance, calc1.lim.one_sided_and_jump, calc1.lim.zero_over_zero_cancel, calc2.impr.limit_of_bounded_area, calc2.ser.partial_sums, precalc.lim.continuity_unbroken_pen, precalc.lim.infinity_and_asymptote]
    detect: {from: "lim[x->a] f(x)", guard: "f(a) != L", to: ["f(a)", "undefined"], correct: "L"}
    pattern: counterexample_slider
    mechanic: slope_walker
    severity: 2

  - id: conditional_reversed
    category: conceptual
    nodes: [prob.cond.conditional_and_independence, prob.cond.bayes_reverses_condition, prob.inf.hypothesis_test_surprise]
    detect: {from: "P(E | F)", to: "P(F | E)", correct: "P(E | F)"}
    pattern: two_paths_diverge
    mechanic: urn_dice
    severity: 3

  - id: equiprobable_assumed
    category: conceptual
    nodes: [prob.basic.probability_as_proportion, prob.rv.expectation_as_weighted_average, adv.num.monte_carlo_pi, disc.count.sum_rule, geom.area.area_by_random_darts, prob.basic.equally_likely_or_weighted]
    detect: {from: "P(E)", guard: "outcomes not equally weighted", to: "|E| / |Omega|", correct: "sum[w in E] P(w)"}
    pattern: counterexample_slider
    mechanic: urn_dice
    severity: 2

  - id: series_terms_to_zero_implies_converges
    category: conceptual
    nodes: [calc2.ser.terms_vs_sum, adv.real.function_series_uniform_limit, precalc.seq.sum_as_pattern]
    detect: {from: "sum[n] a_n", guard: "lim[n->inf] a_n = 0", to: "converges", correct: "undetermined"}
    pattern: counterexample_slider
    mechanic: fill_accumulate
    severity: 2

  - id: converse_assumed
    category: conceptual
    nodes: [disc.logic.if_then_direction, disc.proof.counterexample_breaks_forall]
    detect: {from: "p -> q", to: "q -> p", correct: "p -> q"}
    pattern: two_paths_diverge
    mechanic: sorter
    severity: 2

  - id: set_as_list_not_rule
    category: conceptual
    nodes: [disc.set.membership_rule]
    detect:
      - {from: "x in {y | p(y)}", guard: "p(x) true and x arrived after the sort", to: "not_member", correct: "member"}
      - {from: "x in {y | p(y)}", guard: "p(x) true and x not physically inside the bin", to: "not_member", correct: "member"}
    pattern: replay_on_mechanic
    mechanic: sorter
    severity: 3

  - id: inclusive_or_read_as_exclusive
    category: conceptual
    nodes: [disc.logic.and_or_not]
    detect: {from: "p or q", guard: "p true and q true", to: "false", correct: "true"}
    pattern: two_paths_diverge
    mechanic: sorter
    severity: 3

  - id: correlation_implies_causation
    category: conceptual
    nodes: [prob.stat.correlation_vs_cause]
    detect: {from: "corr(X, Y) high", to: "causes(X, Y)", correct: "undetermined"}
    pattern: two_paths_diverge
    mechanic: network_routes
    severity: 2

  - id: independent_means_disjoint
    category: conceptual
    nodes: [prob.cond.conditional_and_independence, prob.dist.binomial_counts]
    detect: {from: "P(E and F)", guard: "E, F independent", to: "0", correct: "P(E) * P(F)"}
    pattern: replay_on_mechanic
    mechanic: urn_dice
    severity: 2

  - id: substitution_ignores_other_row
    category: conceptual
    nodes: [alg.sys.two_by_two]
    detect:
      - {from: "a * x + b * y = c | d * x + e * y = f", guard: "b != 0", to: "x = c / a", correct: "x = (c * e - b * f) / (a * e - b * d)"}
      - {from: "y = c - a * x | d * x + e * y = f", guard: "e != 0", to: "y = c - a * x | y = c - a * x", correct: "d * x + e * (c - a * x) = f"}
    pattern: replay_on_mechanic
    mechanic: balance
    severity: 3

  - id: machine_gives_two_outputs
    category: conceptual
    nodes: [alg.fn.function_as_machine, alg.fn.graph_as_picture]
    detect: {from: "f(a)", guard: "pairs (a, b) and (a, c) with b != c", to: "is_function", correct: "not_a_function"}
    pattern: two_paths_diverge
    mechanic: machine_pipe
    severity: 3

  - id: slope_confuses_step_with_rate
    category: conceptual
    nodes: [alg.fn.linear_slope]
    detect: {from: "b / a", guard: "b != a * a", to: "a", correct: "b / a"}
    pattern: counterexample_slider
    mechanic: slope_walker
    severity: 3

  - id: angle_measured_by_side_length
    category: conceptual
    nodes: [geom.angle.turn_as_measure]
    detect: {from: "angle(turn a, arm r)", guard: "r != 1", to: "a * r", correct: "a"}
    pattern: replay_on_mechanic
    mechanic: gears_sequence
    severity: 3

  - id: turn_read_as_final_position
    category: conceptual
    nodes: [geom.angle.turn_as_measure]
    detect: {from: "turn(a)", guard: "a > 360", to: "a mod 360", correct: "a"}
    pattern: replay_on_mechanic
    mechanic: gears_sequence
    severity: 2

  - id: sine_confused_with_cosine
    category: conceptual
    nodes: [trig.fn.sine_as_height]
    detect:
      - {from: "sin(a)", guard: "sin(a) != cos(a)", to: "cos(a)", correct: "sin(a)"}
      - {from: "cos(a)", guard: "sin(a) != cos(a)", to: "sin(a)", correct: "cos(a)"}
    pattern: two_paths_diverge
    mechanic: machine_pipe
    severity: 3

  # ---- procedural ----------------------------------------------------------

  - id: inverse_applied_one_side
    category: procedural
    nodes: [alg.eq.one_step, prealg.eq.balance, adv.ode.separable_variables, linalg.sys.row_operations]
    detect: {from: "x + a = b", to: ["x = b", "x + a = b - a"], correct: "x = b - a"}
    pattern: replay_on_mechanic
    mechanic: balance
    severity: 3

  - id: unlike_units_joined
    category: procedural
    nodes: [arith.add.combine_groups]
    detect: {from: "a * x + b * y", guard: "x != y", to: "(a + b) * x", correct: "a * x + b * y"}
    pattern: replay_on_mechanic
    mechanic: ledger
    severity: 3

  - id: factors_added_not_multiplied
    category: procedural
    nodes: [arith.mul.rows_and_columns]
    detect: {from: "a * b", guard: "a > 1 and b > 1", to: "a + b", correct: "a * b"}
    pattern: missing_piece_tiles
    mechanic: tiles
    severity: 3

  - id: fraction_add_across
    category: procedural
    nodes: [arith.frac.parts_and_ratio, arith.frac.common_unit, calc2.tech.partial_fractions_split]
    detect: {from: "a / b + c / d", to: "(a + c) / (b + d)", correct: "(a * d + c * b) / (b * d)"}
    pattern: missing_piece_tiles
    mechanic: tiles
    severity: 3

  - id: exponent_rules_mixed
    category: procedural
    nodes: [alg.pow.same_base_stack, alg.fn.exponential_growth, csmath.crypto.rsa_trapdoor, precalc.exp.natural_base, precalc.seq.geometric_sequence]
    detect:
      - {from: "a^m * a^n", to: "a^(m * n)", correct: "a^(m + n)"}
      - {from: "(a^m)^n", to: "a^(m + n)", correct: "a^(m * n)"}
    pattern: counterexample_slider
    mechanic: gears_sequence
    severity: 2

  - id: chain_rule_missing_inner
    category: procedural
    nodes: [calc1.deriv.rules_as_structure, alg.fn.composition, calc1.apply.related_rates_chain, calc1.deriv.chain_as_gears, calc1.deriv.implicit_as_constraint, calc2.tech.substitution_undoes_chain]
    detect: {from: "d/dx[f(g(x))]", to: "f'(g(x))", correct: "f'(g(x)) * g'(x)"}
    pattern: tree_unwrap
    mechanic: gears_sequence
    severity: 3

  - id: slope_as_rise_only
    category: procedural
    nodes: [alg.fn.linear_slope]
    detect: {from: "b / a", guard: "a != 1", to: "b", correct: "b / a"}
    pattern: counterexample_slider
    mechanic: slope_walker
    severity: 2

  - id: area_uses_slant_side
    category: procedural
    nodes: [geom.area.shear_invariant, geom.area.rect_and_triangle, geom.area.trapezoid_as_two_triangles, geom.cons.auxiliary_lines, geom.cons.hidden_data_hunt, geom.sim.similarity_as_scale]
    detect: {from: "area(parallelogram(b, h, s))", guard: "s > h", to: "b * s", correct: "b * h"}
    pattern: missing_piece_tiles
    mechanic: tiles
    severity: 2

  - id: modular_negative_remainder
    category: procedural
    nodes: [csmath.mod.wraparound]
    detect: {from: "(-a) mod n", guard: "a mod n != 0", to: "-(a mod n)", correct: "n - (a mod n)"}
    pattern: replay_on_mechanic
    mechanic: gears_sequence
    severity: 1

  # ---- notation ------------------------------------------------------------

  - id: variable_as_label
    category: notation
    nodes: [prealg.var.unknown_as_box, alg.expr.distributive_tiles, linalg.vec.span_and_combination]
    detect: {from: "a * x + b * y", to: "(a + b) * x * y", correct: "a * x + b * y"}
    pattern: replay_on_mechanic
    mechanic: ledger
    severity: 2

  - id: path_vs_walk_confusion
    category: notation
    nodes: [graph.walk.repeat_rules, graph.basic.graph_and_paths]
    detect: {from: "path(u, v)", to: "walk(u, v) with repeated vertex", correct: "walk(u, v) without repeated vertices"}
    pattern: replay_on_mechanic
    mechanic: network_routes
    severity: 1

  - id: endpoint_read_as_distance
    category: notation
    nodes: [arith.sub.undo_add]
    detect: {from: "b - a", guard: "a > 0", to: "b", correct: "b - a"}
    pattern: key_mismatch
    mechanic: chest_key
    severity: 2

  - id: graph_read_axes_swapped
    category: notation
    nodes: [alg.fn.graph_as_picture]
    detect: {from: "point(a, b)", guard: "a != b", to: "point(b, a)", correct: "point(a, b)"}
    pattern: replay_on_mechanic
    mechanic: slope_walker
    severity: 2

  # ---- invalid_property ----------------------------------------------------

  - id: distribute_over_wrong_op
    category: invalid_property
    nodes: [alg.expr.distributive_tiles, alg.fn.quadratic_and_sqrt, adv.alg.polynomial_arithmetic, alg.expr.binomial_product, geom.coord.distance_as_pythagoras, geom.tri.pythagoras_as_tiles, precalc.binom.pascal_triangle_expansion, trig.id.pythagorean_identity, trig.law.cosines_extends_pythagoras]
    detect:
      - {from: "(a + b)^2", to: "a^2 + b^2", correct: "a^2 + 2 * a * b + b^2"}
      - {from: "a * (b * c)", to: "(a * b) * (a * c)", correct: "a * b * c"}
    pattern: missing_piece_tiles
    mechanic: tiles
    severity: 3

  - id: log_of_sum
    category: invalid_property
    nodes: [alg.fn.logarithm, alg.pow.log_rules_from_stack, csmath.info.entropy_as_surprise, precalc.exp.natural_base]
    detect:
      - {from: "log(a + b)", to: "log(a) + log(b)", correct: "log(a + b)"}
      - {from: "log(a * b)", to: "log(a) * log(b)", correct: "log(a) + log(b)"}
    pattern: counterexample_slider
    mechanic: machine_pipe
    severity: 2

  - id: derivative_of_product_as_product
    category: invalid_property
    nodes: [calc1.deriv.rules_as_structure, adv.ode.linear_first_order_factor, calc1.deriv.product_as_growing_rectangle, calc1.deriv.quotient_from_product, calc2.tech.by_parts_undoes_product]
    detect: {from: "d/dx[f * g]", to: "f' * g'", correct: "f' * g + f * g'"}
    pattern: missing_piece_tiles
    mechanic: tiles
    severity: 3

  - id: matrix_multiplication_commutes
    category: invalid_property
    nodes: [linalg.map.linear_transformation_2d, linalg.map.compose_as_multiply, csmath.gfx.transform_matrix, graph.matrix.two_step_routes_as_product, linalg.map.inverse_and_systems, geom.trans.rotation_reflection]
    detect: {from: "A * B", to: "B * A", correct: "A * B"}
    pattern: two_paths_diverge
    mechanic: grid_stretch
    severity: 2

  - id: sin_of_sum_distributes
    category: invalid_property
    nodes: [trig.id.angle_sum, trig.circle.unit_circle_radians, adv.four.projection_onto_sines, trig.fn.sine_as_height, trig.id.double_angle]
    detect: {from: "sin(a + b)", to: "sin(a) + sin(b)", correct: "sin(a) * cos(b) + cos(a) * sin(b)"}
    pattern: counterexample_slider
    mechanic: machine_pipe
    severity: 2

  - id: area_scales_like_length
    category: invalid_property
    nodes: [geom.sim.similarity_as_scale]
    detect: {from: "area(scale(F, k))", guard: "k != 1", to: "k * area(F)", correct: "k^2 * area(F)"}
    pattern: missing_piece_tiles
    mechanic: tiles
    severity: 2

  - id: negation_distributes_over_and
    category: invalid_property
    nodes: [disc.logic.and_or_not]
    detect: {from: "not (p and q)", to: "(not p) and (not q)", correct: "(not p) or (not q)"}
    pattern: two_paths_diverge
    mechanic: sorter
    severity: 2

  - id: modulus_of_sum_adds
    category: invalid_property
    nodes: [adv.cplx.plane_and_modulus, linalg.vec.vector_as_displacement, linalg.vec.add_tip_to_tail, precalc.cplx.plane_intro, precalc.vec.arrow_2d_intro, trig.euler.cis_as_rotation]
    detect: {from: "|z + w|", to: "|z| + |w|", correct: "|z + w|"}
    pattern: counterexample_slider
    mechanic: slope_walker
    severity: 2
