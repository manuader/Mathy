    expected_constructions:
      - [extend_side_to_bounding_rectangle, mark_equal_opposite_sides, subtract_corner_rectangle]
      - [draw_line_splitting_into_two_rectangles, mark_equal_opposite_sides, add_two_rectangles]
    cheatsheet_refs: [cs.geom.area_rectangle, cs.geom.perimeter_sum_of_sides, cs.geom.strategy_extend_side]
    strategy_misconceptions: [strategy_missing_auxiliary_line, assumed_equal_segments]
