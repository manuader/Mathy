# Desafíos de Mathy (problemas estilo olimpíada). DATA, sin texto visible:
# título, enunciado, pistas y solución narrada viven en ../locales/es/challenges.yaml
# bajo challenges.<id>.{title, statement, hints[n], solution_steps[n]}.
# Prosa, ejemplo canónico y tabla en S0-desafios.md. Constantes (créditos por estado,
# mínimo de desafíos para mastered) solo en ../K-evaluacion.md.
#
# Campos por desafío:
#   id                      ch.<area>.<slug>; el slug nombra la idea del problema
#   area                    geom | alg | arith | disc | prob | trig | calc | linalg
#                           (calc agrupa nodos calc1 y calc2)
#   tier                    training | regional | international
#   requires                nodos del grafo que deben estar en `ready` para desbloquear;
#                           el validador deriva de acá el campo `challenges` de cada nodo
#   mechanics               la primera es la mecánica dominante; construct cuando hay figura
#   literacy_min            enum literacy del schema; none = jugable sin leer (niveles 0–2)
#   figure                  id de asset SVG (svg.ch.*) o generated:<generador>
#   hidden_data             qué dato falta, qué construcción u operación lo descubre y qué
#                           entrada de cheatsheet lo justifica
#   expected_constructions  lista de caminos válidos; cada camino es una lista ordenada
#   cheatsheet_refs         entradas cs.* declaradas por nodos del grafo (siempre visibles)
#   strategy_misconceptions ids de la sección strategy_misconceptions de este archivo;
#                           las misconceptions de L se heredan del vecindario de `requires`
#   hints                   los tres niveles fijos; el texto de cada nivel es por desafío
#   solution_steps          pasos abstractos como ids de operación para el modo "visto"
#   answer_kind             number | expression | set | proof_sketch
#   generator               generador de variantes con semilla y sus parámetros; null si
#                           el desafío es una figura fija

version: 1

defaults:
  hint_levels: 3
  hint_ids: [what_is_missing, which_line_reveals_it, show_construction]
  tiers: [training, regional, international]
  states: [locked, available, solved_no_hints, solved_hints, seen]
  cheatsheet_open_on_start: true

# Misconceptions de estrategia. Complementan la taxonomía de L (../L-modelo-errores/misconceptions.yaml):
# no describen una regla algebraica mal aplicada sino una decisión de plan equivocada.
# `signal` es el evento del motor sintético o del StepEngine que las dispara (O-arquitectura-tecnica.md).
# Patrón y mecánica siguen el contrato de explanation_patterns.yaml; replay_on_mechanic debe
# declarar construct en mechanics_compatible (cambio pendiente en L, ver S0).
strategy_misconceptions:
  - id: strategy_missing_auxiliary_line
    category: strategy
    signal: answer_or_mark_attempted_while_required_fact_underived
    pattern: replay_on_mechanic
    mechanic: construct
    severity: 2
  - id: assumed_right_angle
    category: strategy
    signal: mark_angle_equal_90_numerically_false
    pattern: replay_on_mechanic
    mechanic: construct
    severity: 3
  - id: assumed_equal_segments
    category: strategy
    signal: mark_segments_equal_numerically_false
    pattern: replay_on_mechanic
    mechanic: construct
    severity: 3
  - id: assumed_parallel
    category: strategy
    signal: mark_lines_parallel_numerically_false
    pattern: replay_on_mechanic
    mechanic: construct
    severity: 2
  - id: assumed_same_whole
    category: strategy
    signal: fraction_applied_to_original_whole_after_whole_changed
    pattern: missing_piece_tiles
    mechanic: tiles
    severity: 2
  - id: counted_twice
    category: strategy
    signal: same_object_in_two_rows_of_ledger
    pattern: replay_on_mechanic
    mechanic: ledger
    severity: 2
  - id: ignored_case
    category: strategy
    signal: answer_set_misses_branch_or_bin
    pattern: two_paths_diverge
    mechanic: sorter
    severity: 2
  - id: assumed_uniform_space
    category: strategy
    signal: sample_space_built_from_outcome_values_not_from_draws
    pattern: replay_on_mechanic
    mechanic: urn_dice
    severity: 3
  - id: ignored_base_rate
    category: strategy
    signal: conditional_computed_without_prior_row
    pattern: replay_on_mechanic
    mechanic: sorter
    severity: 3
  - id: ignored_constraint
    category: strategy
    signal: objective_optimized_with_two_free_variables
    pattern: replay_on_mechanic
    mechanic: slope_walker
    severity: 3
  - id: tracked_wrong_basis_arrow
    category: strategy
    signal: matrix_column_read_from_image_of_wrong_vector
    pattern: replay_on_mechanic
    mechanic: grid_stretch
    severity: 2

challenges:

  # =========================================================================
  # GEOMETRÍA
  # =========================================================================

  - id: ch.geom.trapezoid_hidden_height
    area: geom
    tier: training
    requires: [geom.area.trapezoid_as_two_triangles, geom.tri.pythagoras_as_tiles, geom.cons.auxiliary_lines]
    mechanics: [construct, tiles]
    literacy_min: icons
    figure: generated:gen_trapezoid_hidden_height
    hidden_data:
      - {missing: height, discovered_by: drop_altitude_from_c, uses: cs.geom.pythagoras}
      - {missing: segment_bh, discovered_by: subtract_bases, uses: cs.geom.strategy_draw_altitude}
    expected_constructions:
      - [drop_altitude_from_c, mark_right_angle_at_h, apply_pythagoras_on_cbh]
      - [drop_altitude_from_d, mark_right_angle_at_h, apply_pythagoras_on_dah]
      - [draw_diagonal_ac, drop_altitude_from_c, apply_pythagoras_on_cbh]
    cheatsheet_refs: [cs.geom.area_trapezoid, cs.geom.pythagoras, cs.geom.strategy_draw_altitude, cs.geom.strategy_find_right_triangle]
    strategy_misconceptions: [strategy_missing_auxiliary_line, assumed_right_angle, assumed_equal_segments]
    hints: [what_is_missing, which_line_reveals_it, show_construction]
    solution_steps: [drop_altitude, subtract_bases_for_leg, apply_pythagoras, compute_area]
    answer_kind: number
    generator:
      name: gen_trapezoid_hidden_height
      params: {triples: [[3, 4, 5], [5, 12, 13], [6, 8, 10], [8, 15, 17]], long_base_range: [8, 24], right_angle_at_base: true}

