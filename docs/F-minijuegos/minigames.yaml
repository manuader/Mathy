# Indice de minijuegos de Mathy. DATA, sin ninguna cadena visible al usuario:
# los nombres del minijuego y de cada nivel viven en ../locales/es/minigames.yaml
# bajo minigames.<id>.name y minigames.<id>.levels[n].name (P-internacionalizacion.md).
#
# Se deriva de los 44 archivos docs/F-minijuegos/<node-id>.md (uno por concepto
# de la espina, ver C-knowledge-graph/spine.yaml), leyendo sus secciones
# Desafio, Mastery e Implementacion. `node`, `mechanics`, `analogies` y
# `misconceptions` salen de docs/C-knowledge-graph/graph/*.yaml (fuente de
# verdad); `scenes` sale del campo `manim` del nodo, cruzado con
# docs/I-manim/scenes.yaml; `challenges` se deriva de docs/S-desafios/challenges.yaml
# (todo ch.* cuyo `requires` contenga este nodo). El validador (tools/validate.py)
# comprueba que estos datos son coherentes entre los cinco archivos.
#
# Campos por minijuego:
#   id              igual al id del nodo (p.ej. alg.eq.one_step)
#   node            id del nodo del grafo que instancia este minijuego
#   mechanics       mecanicas del nodo, principal primero
#   analogies       analogia del nodo mas las secundarias que declare el minijuego
#   literacy        {min, max}: rango de la enum literacy que el minijuego soporta
#   levels          progresion de niveles: n, layer (capa de H), evidence (verbos
#                   de K que ese nivel ejercita) y hardens (id corto de que
#                   parametro o transicion introduce/endurece ese nivel)
#   generators      generadores gen_* del nodo, por nombre, con sus parametros
#   scenes          ids de escena de I-manim/scenes.yaml
#   misconceptions  ids de misconceptions esperadas (L-modelo-errores)
#   challenges      ids de ch.* de S-desafios cuyo requires declara este nodo
#   demonstration   id corto de que muestra la mano fantasma la primera vez

