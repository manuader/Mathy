# Calculadora evolutiva. DATA. Sin texto visible al jugador.
# Prosa y reglas: M0-progresion.md. Etiquetas y pistas: ../locales/es/calculator.yaml
# (claves calculator.<op>.label y calculator.<op>.hint).
#
# Campos por op:
#   id               op_<slug>, id canónico (el que citan calc_unlocks en el grafo)
#   tier             fila de la calculadora (ver `tiers`)
#   unlocked_by      nodos del grafo; el op se habilita cuando CUALQUIERA llega a `ready` (K)
#   kind             arithmetic | algebraic | function | symbolic | numeric | structural | logical | statistical
#   input_kind       number | expression | function | matrix | vector | set | graph | distribution
#   display          forma de display (LaTeX corto o MathJSON-ish); la notación final la decide MathLocale (P)
#   locale_dependent true si el símbolo o el nombre cambian con MathLocale (más allá del separador decimal)
#   sandbox          true si el op existe en el sandbox libre; false si solo vive en modo operar
#   aliases          ids op_* históricos que este op absorbe; cada alias aparece exactamente una vez en el archivo
#
# Regla global: un op nunca se revoca. Si todos sus nodos de unlocked_by están en `decayed`, se dibuja con óxido.

unlock_rule: any_ready
never_revoked: true
rust_when: all_unlockers_decayed

tiers:
  - id: t0
    order: 0
    pairs: [[op_add, op_sub], [op_mul, op_div]]
  - id: t1
    order: 1
    pairs: [[op_pow, op_sqrt]]
  - id: t2
    order: 2
    pairs: [[op_exp, op_ln], [op_pow, op_log]]
  - id: t3
    order: 3
    pairs: [[op_expand, op_factor], [op_define_function, op_inverse_function]]
  - id: t4
    order: 4
    pairs: [[op_trig, op_arc_trig]]
  - id: t5
    order: 5
    pairs: [[op_derivative, op_antiderivative]]
  - id: t6
    order: 6
    pairs: [[op_matrix_vector, op_matrix_inverse]]
  - id: t7
    order: 7
    pairs: [[op_fourier_transform, op_inverse_fourier], [op_slope_field, op_solve_ode]]
  - id: t_disc
    order: 8
    pairs: [[op_mod, op_mod_arith]]
  - id: t_prob
    order: 9
    pairs: [[op_conditional_probability, op_bayes]]

ops:

