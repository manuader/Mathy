    level: 1
    spine: true
    prereqs: [found.count.number_line]
    grammar: displace
    mechanics: [gears_sequence, ledger]
    literacy: none
    analogy: number_line_walk
    analogies_secondary: [walker_forward_and_back]
    misconceptions: [equals_as_operator]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
