# Knowledge graph — area `arith` (level 1: the four operations as transformations, negatives,
# fractions, decimals, percent, rates, units, precedence as a tree, primes and divisibility).
# DATA only: no user-visible text. Names live in ../../locales/es/nodes/arith.yaml.
# Enums: ../schema/node.schema.yaml. Spine order and prereqs: ../spine.yaml.
# Aliases absorb ids that other documents (E, G, L) already reference under another name.

area: arith

clusters:
  - add     # addition: displacement on the track, joining groups, running total
  - sub     # subtraction as the key that undoes addition
  - mul     # multiplication: scaling, repeated groups, array, multi-digit algorithm
  - div     # division as the key that undoes scaling; remainder
  - int     # negatives as the opposite direction; signed addition and product
  - frac    # fractions: parts of a whole, equivalence, same-unit addition, common unit, product
  - dec     # decimals as base-ten fractions in the place-value dials
  - pct     # percent as parts per hundred of a total
  - rate    # per-unit rate as division
  - meas    # unit conversion as scaling
  - expr    # precedence as a tree of nested chests
  - pow     # exponent as repeated scaling
  - num     # primes as unique rectangles; divisibility as exact sharing
  - place   # base-ten regrouping (carry / borrow) with odometer dials

