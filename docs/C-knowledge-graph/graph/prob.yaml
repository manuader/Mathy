# Nodos del área prob (Probabilidad y estadística). DATA, sin texto visible: nombres y probes en ../../locales/es/nodes/prob.yaml.
# Schema y enums: ../schema/node.schema.yaml. Presupuesto D0: 22 (±20 %). Tres nodos de espina (34–36).
# Ids de E/G/L con otros clusters (lln, mc, bayes, stat.*) se reconcilian con aliases; `stat` se conserva como
# cluster de estadística descriptiva y regresión porque E y L lo usan.
# prob.basic.probability_as_proportion es alias del nodo de espina 34: el invariante de urn_dice (proportion_stable_in_long_run) ES ese nodo.

area: prob

clusters:
  basic: probabilidad como proporción, espacio muestral, unión/intersección, complemento, conteo, equiprobabilidad
  cond: condicional, independencia, Bayes como llave que invierte la condición, cadenas de Markov
  rv: variables aleatorias, esperanza como promedio ponderado, varianza, acumulada, cambio lineal
  dist: distribuciones (uniforme continua como área, binomial, normal)
  samp: muestra vs población y teorema central del límite
  inf: intervalos de confianza y contraste de hipótesis
  stat: estadística descriptiva (tabla de frecuencias, media como nivelar) y regresión/correlación

nodes:

  # ---- basic ---------------------------------------------------------------
  - id: prob.basic.probability_as_proportion
    area: prob
    level: 6
    spine: true
    prereqs: [arith.frac.parts_and_ratio]
    grammar: random
    mechanics: [urn_dice, tiles, sorter]
    literacy: icons
    layers: [real, intuition, concrete, visual, symbolic, formal, abstract, transfer]
    analogy: urn_of_balls
    misconceptions: [equiprobable_assumed]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
    transfer_to: [geom.area.area_by_random_darts, disc.count.sum_rule, csmath.info.entropy_as_surprise, arith.pct.percent_of_total]
    calc_unlocks: [op_probability]
    cheatsheet: [cs.prob.probability_as_fraction, cs.prob.probability_between_0_and_1, cs.prob.long_run_proportion]
    t_star: 20
    manim: [urn_scene_draw_and_tally, urn_scene_fraction_of_total, urn_scene_frequency_bar_stabilizes]
    next: prob.basic.sample_space_grid
    doc: docs/D-curriculum/D1-espina/34-prob.basic.probability_as_proportion.md
    aliases: [prob.lln.long_run_proportion]

  - {id: prob.basic.sample_space_grid, area: prob, level: 6, prereqs: [prob.basic.probability_as_proportion, arith.mul.scaling], grammar: partition, mechanics: [tiles, urn_dice], literacy: icons, analogy: outfit_combinations, cheatsheet: [cs.prob.sample_space_grid_two_dice], calc_unlocks: [op_count_outcomes]}
  - {id: prob.basic.union_intersection, area: prob, level: 6, prereqs: [prob.basic.sample_space_grid], grammar: partition, mechanics: [sorter, urn_dice], literacy: icons, analogy: hula_hoops_overlap, cheatsheet: [cs.prob.addition_rule_inclusion_exclusion], calc_unlocks: [op_probability]}
  - {id: prob.basic.complement_fills_the_rest, area: prob, level: 6, prereqs: [prob.basic.probability_as_proportion], grammar: invert, mechanics: [urn_dice, chest_key, sorter], literacy: icons, analogy: hula_hoops_overlap, cheatsheet: [cs.prob.complement_rule], calc_unlocks: [op_probability]}
  - {id: prob.basic.count_outcomes_by_structure, area: prob, level: 6, prereqs: [prob.basic.sample_space_grid], grammar: partition, mechanics: [ledger, tiles], literacy: icons, analogy: outfit_combinations, cheatsheet: [cs.prob.counting_principle, cs.prob.permutations_combinations], calc_unlocks: [op_count_outcomes]}
  - {id: prob.basic.equally_likely_or_weighted, area: prob, level: 6, prereqs: [prob.basic.probability_as_proportion], grammar: random, mechanics: [urn_dice, tiles], literacy: icons, analogy: spinner_wheel, misconceptions: [equiprobable_assumed], cheatsheet: [cs.prob.uniform_vs_weighted_outcomes], aliases: [prob.dist.uniform_vs_biased]}

