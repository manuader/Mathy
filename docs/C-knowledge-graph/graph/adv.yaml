# Nodos del área adv (matemática avanzada). DATA, sin texto visible: nombres en ../../locales/es/nodes/adv.yaml.
# Enums y reglas en ../schema/node.schema.yaml. Presupuesto D0: 36 (±20 %).
# Los nodos sin capa real/concrete declaran `layers` explícitamente: la analogía ya no aporta (C0).
# Clusters canónicos: cplx (aliases cx/complex), alg (aliases grp/abstract/ring), topo (alias top), num (alias dyn/stoch).

area: adv

clusters:
  cplx: "complejos: i como eje, plano y módulo, multiplicación como giro y escala, Euler, raíces, funciones como deformación"
  real: "análisis real: supremo, Cauchy, ε-δ, continuidad uniforme, series de funciones, Riemann formal"
  alg: "álgebra abstracta: grupo como acciones reversibles, cosets, homomorfismos, anillos, cuerpos, Cayley"
  topo: "topología: abierto/cerrado, conexidad, compacidad, característica de Euler"
  ode: "ecuaciones diferenciales: campo de pendientes, Euler numérico, separables, lineales, sistemas"
  num: "numérico: Newton, diferencias finitas, Monte Carlo"
  opt: "optimización: gradiente descendente, convexidad, programación lineal y dual"
  four: "Fourier: proyección sobre senos, transformada como máquina, inversa como llave"

nodes:

