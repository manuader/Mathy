# Nodos del área graph (teoría de grafos). DATA, sin texto visible: nombres y probes en ../../locales/es/nodes/graph.yaml.
# Enums y reglas en ../schema/node.schema.yaml. Presupuesto D0: 12 (±20 %). Nivel 1–2 jugable sin leer.

area: graph

clusters:
  basic: "grafo como nodos y aristas; la conexión no depende del dibujo"
  walk: "paseo, camino y ciclo: qué se puede repetir"
  deg: "grado y lema del apretón de manos"
  conn: "componentes conexas"
  tree: "árbol: conexo sin ciclos"
  euler: "recorridos que agotan aristas (Euler) o visitan todos los nodos (Hamilton)"
  color: "coloreo de vecinos"
  search: "BFS y DFS como frontera que avanza"
  path: "camino más corto con pesos"
  matrix: "matriz de adyacencia y rutas de k pasos"
  flow: "flujo máximo y corte mínimo"
  planar: "planaridad y fórmula de Euler"
  match: "bipartitos y emparejamientos"

nodes:

  - id: graph.basic.graph_and_paths
    area: graph
    level: 1
    spine: true
    prereqs: [found.count.cardinality]
    grammar: relate
    mechanics: [network_routes]
    literacy: none
    layers: [real, intuition, concrete, visual, symbolic, formal, abstract, transfer]
    analogy: city_routes
    misconceptions: [path_vs_walk_confusion]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
    transfer_to: [arith.num.factor_tree, linalg.map.matrix_counts_routes, prob.cond.markov_chain_walk]
    calc_unlocks: [op_graph_properties]
    cheatsheet: [cs.graph.graph_vocabulary]
    manim: [network_scene_islands_to_dots, network_scene_same_graph_redrawn]
    next: graph.walk.repeat_rules
    doc: docs/D-curriculum/D1-espina/37-graph.basic.graph_and_paths.md

  - {id: graph.walk.repeat_rules, area: graph, level: 2, prereqs: [graph.basic.graph_and_paths], grammar: relate, mechanics: [network_routes], literacy: icons, analogy: city_routes, misconceptions: [path_vs_walk_confusion], cheatsheet: [cs.graph.walk_path_cycle], calc_unlocks: [op_graph_properties]}
  - {id: graph.deg.handshake_lemma, area: graph, level: 2, prereqs: [graph.basic.graph_and_paths, arith.add.combine_groups], grammar: relate, mechanics: [network_routes, ledger], literacy: icons, analogy: friends_handshakes, misconceptions: [], cheatsheet: [cs.graph.handshake_lemma], calc_unlocks: [op_graph_properties]}
  - {id: graph.conn.components, area: graph, level: 2, prereqs: [graph.walk.repeat_rules], grammar: relate, mechanics: [network_routes, sorter], literacy: icons, analogy: city_routes, misconceptions: [], cheatsheet: [cs.graph.connected_components], calc_unlocks: [op_graph_properties]}
  - {id: graph.tree.tree_no_cycles, area: graph, level: 2, prereqs: [graph.walk.repeat_rules, graph.conn.components], grammar: relate, mechanics: [network_routes], literacy: icons, analogy: river_tributaries, misconceptions: [], cheatsheet: [cs.graph.tree_edges_n_minus_1], calc_unlocks: [op_graph_properties], aliases: [graph.tree.no_cycles]}
  - {id: graph.euler.bridges_konigsberg, area: graph, level: 3, prereqs: [graph.deg.handshake_lemma, graph.walk.repeat_rules], grammar: relate, mechanics: [network_routes], literacy: icons, analogy: city_routes, misconceptions: [], cheatsheet: [cs.graph.euler_path_degree_rule], calc_unlocks: [op_graph_properties]}
  - {id: graph.euler.hamilton_visits_every_node, area: graph, level: 3, prereqs: [graph.euler.bridges_konigsberg], grammar: relate, mechanics: [network_routes], literacy: icons, analogy: city_routes, misconceptions: [], cheatsheet: [cs.graph.hamilton_vs_euler], calc_unlocks: [op_graph_properties]}
  - {id: graph.color.map_coloring, area: graph, level: 3, prereqs: [graph.basic.graph_and_paths, found.sort.by_attribute], grammar: partition, mechanics: [network_routes, sorter], literacy: icons, analogy: sorting_bins, misconceptions: [], cheatsheet: [cs.graph.greedy_coloring], calc_unlocks: [op_graph_coloring]}
  - {id: graph.search.bfs_dfs_frontier, area: graph, level: 4, prereqs: [graph.conn.components, graph.tree.tree_no_cycles], grammar: relate, mechanics: [network_routes, gears_sequence], literacy: short_text, analogy: city_routes, misconceptions: [], cheatsheet: [cs.graph.bfs_dfs_order], calc_unlocks: [op_graph_search]}
  - {id: graph.path.shortest_path, area: graph, level: 4, prereqs: [graph.search.bfs_dfs_frontier, arith.add.running_total], grammar: relate, mechanics: [network_routes, ledger], literacy: short_text, analogy: city_routes, misconceptions: [], cheatsheet: [cs.graph.dijkstra_relax], calc_unlocks: [op_graph_search], aliases: [graph.path.shortest]}
  - {id: graph.planar.no_crossing_euler_formula, area: graph, level: 4, prereqs: [graph.basic.graph_and_paths, geom.top.euler_characteristic], grammar: invariant, mechanics: [network_routes, construct], literacy: short_text, analogy: city_routes, misconceptions: [], cheatsheet: [cs.graph.euler_formula_planar], calc_unlocks: [op_euler_characteristic]}
  - {id: graph.matrix.two_step_routes_as_product, area: graph, level: 6, prereqs: [graph.walk.repeat_rules, linalg.map.compose_as_multiply], grammar: relate, mechanics: [network_routes, grid_stretch], literacy: short_text, layers: [visual, symbolic, formal, abstract, transfer], misconceptions: [matrix_multiplication_commutes], cheatsheet: [cs.graph.adjacency_matrix_powers], calc_unlocks: [op_graph_properties, op_matrix_multiply]}
  - {id: graph.flow.max_flow_min_cut, area: graph, level: 7, prereqs: [graph.path.shortest_path, arith.add.running_total], grammar: accumulate, mechanics: [network_routes, fill_accumulate], literacy: short_text, analogy: river_tributaries, misconceptions: [], cheatsheet: [cs.graph.max_flow_min_cut], calc_unlocks: [op_max_flow]}
  - {id: graph.match.bipartite_matching, area: graph, level: 7, prereqs: [graph.color.map_coloring, found.cmp.same_amount], grammar: relate, mechanics: [network_routes, sorter], literacy: short_text, analogy: sorting_bins, misconceptions: [], cheatsheet: [cs.graph.bipartite_two_colors, cs.graph.matching_hall], calc_unlocks: [op_max_flow]}
