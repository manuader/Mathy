# Trigonometría. DATA, sin texto visible: nombres y probes en ../../locales/es/nodes/trig.yaml.
# Nivel 4 (razones en triángulo rectángulo en 3). El ángulo como giro vive en geom.angle.turn_as_measure
# (alias trig.ang.angle_as_turn). Espina: 43 circle.unit_circle_radians · 44 fn.sine_as_height.

area: trig

clusters:
  ratio: razones en el triángulo rectángulo como invariantes de semejanza
  circle: círculo unitario; radián como longitud de arco
  ang: signos y ángulo de referencia por cuadrante
  fn: seno como altura; la rueda desenrollada; periodicidad; tangente; transformaciones
  id: identidades como construcciones sobre el mismo triángulo
  inv: inversas con ramas
  law: leyes de senos y cosenos por trazar la altura
  polar: coordenadas por giro y distancia
  rot: matriz de rotación
  euler: complejos como puente

nodes:

  # ---- ratio ----------------------------------------------------------------
  - {id: trig.ratio.similar_shadows, area: trig, level: 3, prereqs: [geom.sim.similarity_as_scale, geom.tri.pythagoras_as_tiles], grammar: scale, mechanics: [grid_stretch, construct, slope_walker], literacy: icons, analogy: shadow_and_stick, misconceptions: [], cheatsheet: [cs.trig.sohcahtoa, cs.trig.special_triangles_30_45_60], calc_unlocks: [op_sin_cos_tan_of_angle, op_solve_right_triangle]}

  # ---- circle ---------------------------------------------------------------
