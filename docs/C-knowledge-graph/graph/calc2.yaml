# Nodos del área calc2 (Cálculo II). DATA, sin texto visible: nombres y probes en ../../locales/es/nodes/calc2.yaml.
# Schema y enums: ../schema/node.schema.yaml. Presupuesto D0: 18 (±20 %).
# Mecánicas: chest_key para las técnicas como llaves, fill_accumulate para áreas/volúmenes/sumas, gears_sequence para series.

area: calc2

clusters:
  tech: técnicas de integración como llaves que deshacen reglas de derivación
  impr: integrales sobre regiones no acotadas como límite de áreas acotadas
  int: aplicaciones geométricas de la integral (área entre curvas, volumen por rebanadas)
  ser: series como acumulación de infinitos términos y sus criterios de convergencia
  taylor: polinomios que imitan a una función copiando sus derivadas
  parpol: curvas paramétricas, polares y sólidos de revolución
  ode: ecuaciones diferenciales introductorias (la tasa como regla)

