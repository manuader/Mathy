    cheatsheet: [cs.linalg.matrix_columns_are_basis_images, cs.linalg.matrix_vector_product, cs.linalg.rotation_shear_reflection_matrices]
    t_star: 45
    manim: [grid_scene_rubber_sheet_house, grid_scene_basis_arrows_land, pipe_scene_vector_in_vector_out, grid_scene_sheet_intro]
