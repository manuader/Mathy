# Nodos del área linalg (Álgebra lineal). DATA, sin texto visible: nombres y probes en ../../locales/es/nodes/linalg.yaml.
# Schema y enums: ../schema/node.schema.yaml. Presupuesto D0: 24 (±20 %). Cuatro nodos de espina (30–33).
# linalg.map.linear_transformation_3d está en la lista de espera para 3D de D0.
# Ids casi duplicados de E/G/H/L (det.area_scaling, mat.matrix_columns, space.in_span_or_not, vec.basis...) se reconcilian con aliases.

area: linalg

clusters:
  vec: vectores como desplazamientos, suma, escala y combinación lineal
  map: matrices como transformaciones (columnas = imágenes de la base, producto = composición, inversa, 3D, rutas)
  sys: sistemas de ecuaciones y eliminación como operaciones que conservan las soluciones
  det: determinante como factor de área/volumen y sus reglas
  eig: eigenvectores como direcciones que no giran y diagonalización
  basis: independencia, base como receta única y cambio de base
  orth: producto punto, proyección como sombra y bases ortonormales
  svd: mínimos cuadrados como proyección y SVD como girar-estirar-girar

nodes:

  # ---- vec -----------------------------------------------------------------
  - id: linalg.vec.vector_as_displacement
    area: linalg
    level: 6
    spine: true
    prereqs: [alg.fn.graph_as_picture, arith.add.displacement]
    grammar: displace
    mechanics: [grid_stretch, gears_sequence]
    literacy: icons
    layers: [real, intuition, concrete, visual, symbolic, formal, abstract, transfer]
    analogy: treasure_map_arrows
    misconceptions: [modulus_of_sum_adds]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
    transfer_to: [trig.rot.rotation_matrix, adv.cplx.plane_and_modulus, mvcalc.field.arrow_at_every_point, geom.trans.dilation]
    calc_unlocks: [op_vector_length]
    cheatsheet: [cs.linalg.vector_components, cs.linalg.vector_length]
    manim: [grid_scene_arrow_on_map, gear_scene_steps_east_then_north]
    next: linalg.vec.add_tip_to_tail
    doc: docs/D-curriculum/D1-espina/30-linalg.vec.vector_as_displacement.md

  - {id: linalg.vec.add_tip_to_tail, area: linalg, level: 6, prereqs: [linalg.vec.vector_as_displacement], grammar: displace, mechanics: [grid_stretch, gears_sequence], literacy: icons, analogy: treasure_map_arrows, misconceptions: [modulus_of_sum_adds], cheatsheet: [cs.linalg.vector_addition_components], calc_unlocks: [op_vector_arith]}
  - {id: linalg.vec.scale_and_reverse, area: linalg, level: 6, prereqs: [linalg.vec.vector_as_displacement, arith.mul.scaling], grammar: scale, mechanics: [grid_stretch], literacy: icons, analogy: treasure_map_arrows, cheatsheet: [cs.linalg.scalar_multiple], calc_unlocks: [op_vector_arith]}

  - id: linalg.vec.span_and_combination
    area: linalg
    level: 6
    spine: true
    prereqs: [linalg.vec.vector_as_displacement, arith.mul.scaling]
    grammar: displace
    mechanics: [grid_stretch, ledger, gears_sequence]
    literacy: icons
    layers: [real, intuition, concrete, visual, symbolic, formal, abstract, transfer]
    analogy: two_kinds_of_steps
    misconceptions: [variable_as_label]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
    transfer_to: [prob.rv.expectation_as_weighted_average, mvcalc.field.arrow_at_every_point, adv.alg.polynomial_arithmetic]
    calc_unlocks: [op_vector_arith]
    cheatsheet: [cs.linalg.linear_combination, cs.linalg.span]
    manim: [grid_scene_two_kinds_of_steps, ledger_scene_recipe_of_steps]
    next: linalg.map.linear_transformation_2d
    doc: docs/D-curriculum/D1-espina/31-linalg.vec.span_and_combination.md

  # ---- map -----------------------------------------------------------------
