# Knowledge graph — area `prealg` (level 2: the unknown as a box, equality as a balance,
# every operation has a key; expressions, properties, signs, exponents, ratio, percent,
# coordinate grid, inequalities, input-output tables).
# DATA only: no user-visible text. Names live in ../../locales/es/nodes/prealg.yaml.
# Enums: ../schema/node.schema.yaml. Spine order and prereqs: ../spine.yaml.

area: prealg

clusters:
  - var     # the unknown as a closed box
  - expr    # expressions: substitute, like terms, implicit grouping (3x, fraction bar)
  - eq      # equality as a balance that stays level under identical actions
  - inv     # every operation has a key (inverse) chosen in pure arithmetic
  - prop    # commutative / associative / identity as invariants with letters
  - int     # sign rules for the four operations on integers
  - exp     # powers of ten, place value and scientific notation
  - ratio   # scaling a recipe, rate per unit, proportion as a line through the origin
  - pct     # percent as hundredths grid; percent as fill level and change
  - coord   # position on a grid as two numbers (first quadrant, visual only)
  - ineq    # comparing two expressions on a tilted balance (<, >)
  - fn      # input-output table of a rule machine
  - pat     # reading the rule from a table of constant steps

nodes:

  - id: prealg.var.unknown_as_box
    area: prealg
    level: 2
    spine: true
    prereqs: [arith.expr.precedence_tree]
    grammar: partition
    mechanics: [ledger, balance, chest_key]
    literacy: none
    analogy: mystery_box
    misconceptions: [variable_as_label]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
    transfer_to: [alg.fn.function_as_machine, alg.expr.distributive_tiles, prob.rv.random_variable_as_machine, linalg.map.inverse_and_systems]
    calc_unlocks: [op_variable]
    cheatsheet: [cs.prealg.letter_names_the_box, cs.prealg.coefficient_counts_boxes]
    manim: [ledger_box_hides_tokens, chest_box_as_tree_leaf]
    next: prealg.eq.balance
    doc: docs/D-curriculum/D1-espina/10-prealg.var.unknown_as_box.md

  - id: prealg.eq.balance
    area: prealg
    level: 2
    spine: true
    prereqs: [prealg.var.unknown_as_box]
    grammar: invariant
    mechanics: [balance]
    literacy: none
    analogy: balance_pans
    misconceptions: [equals_as_operator, inverse_applied_one_side]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
    transfer_to: [alg.eq.one_step, trig.id.identity_as_balance, disc.mod.congruence_both_sides, linalg.sys.row_operations]
    calc_unlocks: [op_equals]
    cheatsheet: [cs.prealg.equals_means_level_pans, cs.prealg.same_action_both_sides]
    manim: [balance_equal_pans_stay_level, balance_remove_one_side_tilts]
    next: prealg.inv.operation_as_key
    doc: docs/D-curriculum/D1-espina/11-prealg.eq.balance.md

  - id: prealg.inv.operation_as_key
    area: prealg
    level: 2
    spine: true
    prereqs: [arith.sub.undo_add, arith.div.undo_mul, arith.int.negatives]
    grammar: invert
    mechanics: [chest_key]
    literacy: none
    analogy: chest_single_lock
    misconceptions: [wrong_inverse_choice]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
    transfer_to: [alg.fn.inverse_function, calc1.ftc.integral_undoes_derivative, linalg.map.inverse_and_systems, geom.trans.undo_transformation]
    calc_unlocks: [op_inverse_op]
    cheatsheet: [cs.prealg.every_operation_has_a_key, cs.prealg.inverse_pairs_table]
    manim: [chest_key_matches_lock, chest_wrong_key_stays_shut]
    next: alg.eq.one_step
    doc: docs/D-curriculum/D1-espina/12-prealg.inv.operation_as_key.md

  # ---- expr / prop ---------------------------------------------------------------------------
  - {id: prealg.expr.substitute_value, area: prealg, level: 2, prereqs: [prealg.var.unknown_as_box], grammar: compose, mechanics: [machine_pipe, ledger], literacy: none, analogy: mystery_box, cheatsheet: [cs.prealg.substitute_then_evaluate], calc_unlocks: [op_evaluate_expr]}
  - {id: prealg.expr.like_terms, area: prealg, level: 2, prereqs: [prealg.var.unknown_as_box], grammar: partition, mechanics: [ledger, sorter], literacy: none, analogy: fruit_ledger, aliases: [alg.expr.like_terms], cheatsheet: [cs.prealg.combine_like_terms_only], calc_unlocks: [op_simplify_terms]}
  - {id: prealg.expr.implicit_grouping, area: prealg, level: 2, prereqs: [prealg.var.unknown_as_box, arith.frac.parts_and_ratio], grammar: compose, mechanics: [chest_key, machine_pipe], literacy: icons, analogy: chest_nested, cheatsheet: [cs.prealg.juxtaposition_means_times, cs.prealg.fraction_bar_groups]}
  - {id: prealg.prop.order_does_not_matter, area: prealg, level: 2, prereqs: [arith.mul.rows_and_columns, arith.add.combine_groups, prealg.var.unknown_as_box], grammar: invariant, mechanics: [ledger, tiles, balance], literacy: none, analogy: fruit_ledger, cheatsheet: [cs.prealg.commutative_associative_with_letters, cs.prealg.identity_zero_and_one]}

  # ---- int / exp -----------------------------------------------------------------------------
  - {id: prealg.int.sign_rules, area: prealg, level: 2, prereqs: [arith.int.add_signed, arith.int.mul_signed], grammar: scale, mechanics: [gears_sequence, grid_stretch, sorter], literacy: none, analogy: debt_ledger, cheatsheet: [cs.prealg.sign_rules_four_operations], calc_unlocks: [op_signed_arith]}
  - {id: prealg.exp.powers_of_ten, area: prealg, level: 2, prereqs: [arith.pow.repeated_scaling, arith.dec.tenths_as_place], grammar: nonlinear, mechanics: [gears_sequence, ledger], literacy: icons, analogy: odometer_dials, cheatsheet: [cs.prealg.place_value_as_power_of_ten, cs.prealg.scientific_notation], calc_unlocks: [op_sci_notation]}

  # ---- ratio / pct ---------------------------------------------------------------------------
  - {id: prealg.ratio.scaling_recipe, area: prealg, level: 2, prereqs: [arith.frac.equivalent], grammar: scale, mechanics: [ledger, tiles], literacy: none, analogy: juice_mix_ratio, aliases: [prealg.prop.scaling_recipe], cheatsheet: [cs.prealg.ratio_scales_both_parts], calc_unlocks: [op_ratio_scale]}
  - {id: prealg.ratio.rate_per_unit, area: prealg, level: 2, prereqs: [prealg.ratio.scaling_recipe, arith.rate.per_unit], grammar: rate, mechanics: [slope_walker, machine_pipe], literacy: icons, analogy: walker_on_ramp, cheatsheet: [cs.prealg.proportional_means_constant_ratio], calc_unlocks: [op_proportion_solve]}
  - {id: prealg.ratio.proportion_as_line, area: prealg, level: 2, prereqs: [prealg.ratio.rate_per_unit, prealg.coord.grid_position], grammar: rate, mechanics: [slope_walker], literacy: icons, analogy: walker_on_ramp, cheatsheet: [cs.prealg.proportional_graph_line_through_origin]}
  - {id: prealg.pct.hundredths, area: prealg, level: 2, prereqs: [arith.pct.percent_of_total, arith.dec.tenths_as_place], grammar: partition, mechanics: [tiles], literacy: icons, analogy: chocolate_bar_grid, cheatsheet: [cs.prealg.percent_decimal_fraction_triangle], calc_unlocks: [op_percent_convert]}
  - {id: prealg.pct.percent_fill, area: prealg, level: 2, prereqs: [prealg.pct.hundredths, prealg.ratio.scaling_recipe], grammar: accumulate, mechanics: [fill_accumulate], literacy: icons, analogy: tank_filling, cheatsheet: [cs.prealg.percent_change_as_fill_delta], calc_unlocks: [op_percent_change]}

  # ---- coord / ineq --------------------------------------------------------------------------
  - {id: prealg.coord.grid_position, area: prealg, level: 2, prereqs: [found.count.number_line], grammar: displace, mechanics: [slope_walker, network_routes], literacy: none, layers: [real, intuition, concrete, visual], analogy: treasure_map_arrows}
  - {id: prealg.ineq.compare_expressions, area: prealg, level: 2, prereqs: [prealg.eq.balance, found.cmp.bigger_smaller], grammar: invariant, mechanics: [balance, sorter], literacy: none, analogy: balance_tilted, cheatsheet: [cs.prealg.lt_gt_as_tilt], calc_unlocks: [op_compare]}

  # ---- fn / pat ------------------------------------------------------------------------------
  - {id: prealg.fn.input_output_table, area: prealg, level: 2, prereqs: [found.pat.rule_machine, prealg.expr.substitute_value], grammar: compose, mechanics: [machine_pipe, ledger], literacy: none, analogy: function_machine, cheatsheet: [cs.prealg.table_records_machine], calc_unlocks: [op_table_from_rule]}
  - {id: prealg.pat.rule_from_table, area: prealg, level: 2, prereqs: [prealg.fn.input_output_table], grammar: displace, mechanics: [gears_sequence, machine_pipe], literacy: none, analogy: function_machine, cheatsheet: [cs.prealg.constant_step_reveals_rule]}
