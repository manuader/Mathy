# Knowledge graph — area `alg` (level 3: equations, inequalities, systems, polynomials and
# factoring, functions as machines, exponentials and logarithms, radicals, rational
# expressions, absolute value).
# DATA only: no user-visible text. Names live in ../../locales/es/nodes/alg.yaml.
# Enums: ../schema/node.schema.yaml. Spine order and prereqs: ../spine.yaml.
# prealg.expr.like_terms (referenced by G) lives in prealg as prealg.expr.like_terms (alias).

area: alg

clusters:
  - eq      # solving: one key, several keys in order, words to equation, boxes both sides, quadratic roots
  - ineq    # inequality as a tilted balance; solution as a shaded region
  - sys     # two balances sharing boxes; two lines crossing; parallel or coincident lines
  - expr    # distributive tiles, binomial product, factoring, completing the square
  - poly    # polynomial as a ledger of coefficients by degree
  - fn      # function as machine, graph as trace, slope, composition, inverse, quadratic, exp, log, domain, words to linear
  - pow     # exponent rules as stacking; logarithm rules as the same stack read backwards
  - rad     # roots as fractional exponents
  - rat     # rational expressions: domain hole at zero denominator, cancel common factor
  - abs     # absolute value as distance: equations with two branches

nodes:

  - id: alg.eq.one_step
    area: alg
    level: 3
    spine: true
    prereqs: [prealg.eq.balance, prealg.inv.operation_as_key]
    grammar: invariant
    mechanics: [balance, chest_key]
    literacy: icons
    analogy: balance_pans
    misconceptions: [sign_flip_on_move, wrong_inverse_choice, inverse_applied_one_side]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
    transfer_to: [linalg.map.inverse_and_systems, disc.mod.clock_equivalence, trig.id.double_angle]
    calc_unlocks: [op_solve_linear]
    cheatsheet: [cs.alg.one_key_both_sides, cs.alg.check_by_substituting]
    manim: [balance_key_both_sides, chest_pick_key_for_lock]
    next: alg.eq.multi_step
    doc: docs/D-curriculum/D1-espina/13-alg.eq.one_step.md

  - id: alg.eq.multi_step
    area: alg
    level: 3
    spine: true
    prereqs: [alg.eq.one_step, arith.expr.precedence_tree]
    grammar: invert
    mechanics: [chest_key, balance, machine_pipe]
    literacy: icons
    analogy: chest_nested
    misconceptions: [unwrap_order_inverted, sign_flip_on_move]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
    transfer_to: [linalg.sys.row_operations, calc2.tech.substitution_undoes_chain, adv.ode.separable_variables]
    calc_unlocks: [op_solve_linear]
    cheatsheet: [cs.alg.unwrap_outermost_first, cs.alg.solving_steps_checklist]
    manim: [chest_unwrap_outer_to_inner, balance_two_keys_in_order]
    next: alg.expr.distributive_tiles
    doc: docs/D-curriculum/D1-espina/14-alg.eq.multi_step.md

