# Nivel 5. La derivada es el caminante que hace zoom en la colina (slope_walker); la integral es el
# tanque que se llena (fill_accumulate); el teorema fundamental es el tercer regreso de la llave.
# Espina: 26 deriv.rate_as_slope_limit · 27 deriv.rules_as_structure · 28 int.accumulation ·
#         29 ftc.integral_undoes_derivative.

area: calc1

