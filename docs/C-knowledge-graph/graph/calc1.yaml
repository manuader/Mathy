  deriv: secantes → tangente; reglas como estructura; cadena, producto, cociente, implícita
  apply: pendiente cero; tasas encadenadas; movimiento; linealización; Newton
  int: acumulación; refinar; área con signo; propiedades
  ftc: la integral deshace la derivada; familia de antiderivadas

