  # ---- circle ---------------------------------------------------------------
  - {id: geom.circle.radius_and_arc, area: geom, level: 2, prereqs: [geom.angle.turn_as_measure, geom.class.polygon_by_sides], grammar: scale, mechanics: [gears_sequence, construct], literacy: icons, analogy: clock_face_wrap, misconceptions: [], cheatsheet: [cs.geom.circumference_2_pi_r, cs.geom.arc_length_fraction_of_turn], calc_unlocks: [op_circle]}
