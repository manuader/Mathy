# Geometría. DATA, sin texto visible: nombres y probes en ../../locales/es/nodes/geom.yaml.
# Niveles 1–3: los nodos de nivel 1–2 se juegan sin leer (baldosas, giros, plegar).
# `construct` es la mecánica de la rama: cada trazo revela un dato que ya estaba.
# Espina: 38 area.rect_and_triangle · 39 angle.turn_as_measure · 40 sim.similarity_as_scale ·
#         41 tri.pythagoras_as_tiles · 42 cons.auxiliary_lines.

area: geom

clusters:
  class: puntos, segmentos y polígonos clasificados por lo que se ve
  angle: ángulo como giro; paralelas; suma de ángulos
  line: rectas en coordenadas
  area: área como baldosas; perímetro como camino; cizalla; círculo
  solid: volumen por capas; sólidos redondos por trasvase
  tri: rigidez, desigualdad y Pitágoras
  sim: semejanza como escala
  circle: radio, arco, cuerdas y ángulos en el círculo
  trans: mover sin deformar; dilatar; deshacer
  coord: distancia y punto medio en la grilla
  cons: construcciones auxiliares; puerta a los desafíos
  top: contar vértices, aristas y caras

nodes:

  # ---- class ----------------------------------------------------------------
  - {id: geom.class.polygon_by_sides, area: geom, level: 1, prereqs: [found.count.cardinality], grammar: partition, mechanics: [sorter, construct], literacy: none, analogy: sorting_bins, misconceptions: [], cheatsheet: [cs.geom.polygons_by_sides], calc_unlocks: []}
  - {id: geom.class.quadrilateral_hierarchy, area: geom, level: 2, prereqs: [geom.class.polygon_by_sides, geom.angle.parallel_transversal], grammar: partition, mechanics: [sorter, construct], literacy: icons, analogy: sorting_bins, misconceptions: [], cheatsheet: [cs.geom.quadrilateral_family_tree], calc_unlocks: []}

  # ---- angle ----------------------------------------------------------------
  - id: geom.angle.turn_as_measure
    area: geom
    level: 1
    spine: true
    prereqs: [found.count.number_line, arith.frac.parts_and_ratio]
    grammar: displace
    mechanics: [gears_sequence, construct, grid_stretch]
    literacy: none
    analogy: number_line_walk
    misconceptions: [angle_measured_by_side_length, turn_read_as_final_position]
    probes: [recognize, explain, manipulate, apply, generalize, transfer]
    transfer_to: [trig.circle.unit_circle_radians, disc.mod.clock_equivalence, adv.cplx.multiplication_rotates_scales]
    calc_unlocks: [op_angle]
    cheatsheet: [cs.geom.full_turn_360, cs.geom.angle_names_right_straight, cs.geom.exterior_angle_completes_turn]
    manim: [gear_scene_turn_as_angle, construction_scene_extend_side_exterior_angle]
    next: geom.angle.parallel_transversal
    doc: docs/D-curriculum/D1-espina/39-geom.angle.turn_as_measure.md
    aliases: [trig.ang.angle_as_turn]
  - {id: geom.angle.parallel_transversal, area: geom, level: 2, prereqs: [geom.angle.turn_as_measure], grammar: invariant, mechanics: [construct, grid_stretch], literacy: icons, layers: [intuition, visual, symbolic, formal, transfer], misconceptions: [], cheatsheet: [cs.geom.parallel_angles_equal_or_supplementary], calc_unlocks: []}
  - {id: geom.angle.triangle_sum_half_turn, area: geom, level: 2, prereqs: [geom.angle.parallel_transversal, geom.class.polygon_by_sides], grammar: invariant, mechanics: [construct, gears_sequence], literacy: icons, layers: [intuition, visual, symbolic, formal, transfer], misconceptions: [], cheatsheet: [cs.geom.triangle_angles_180, cs.geom.polygon_angle_sum], calc_unlocks: [op_angle]}

