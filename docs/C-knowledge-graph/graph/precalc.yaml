# Precálculo. DATA, sin texto visible: nombres y probes en ../../locales/es/nodes/precalc.yaml.
# Nivel 4. Límites intuitivos (el caminante que se acerca a la pared), sucesiones como engranajes,
# transformaciones de funciones como deformaciones de la grilla. Espina: 25 lim.approach.

area: precalc

clusters:
  lim: acercarse sin llegar; asíntotas; continuidad como trazo sin levantar el lápiz
  seq: sucesiones como engranajes; la suma con patrón y su notación
  conic: cónicas como cortes y como reglas de distancia
  cplx: i como cuarto de giro
  vec: flecha en 2D
  param: el tiempo como entrada escondida
  fntr: desplazar, estirar y reflejar una gráfica
  binom: triángulo de Pascal y binomio
  exp: la base natural
  fn: crecer/decrecer; máquinas por tramos

nodes:

