# Nodos del área disc (matemática discreta). DATA, sin texto visible: nombres en ../../locales/es/nodes/disc.yaml.
# Enums y reglas en ../schema/node.schema.yaml. Presupuesto D0: 16 (±20 %).

area: disc

clusters:
  logic: "proposiciones, conectivos, tablas de verdad, implicación, cuantificadores"
  set: "pertenencia por regla, Venn, unión e intersección"
  rel: "relaciones como flechas, función vs relación, clases de equivalencia"
  proof: "directa como cadena de construcciones, contraejemplo, contradicción"
  ind: "inducción como dominó"
  rec: "recurrencias: paso siguiente y árbol de llamadas"
  count: "suma, producto, permutaciones y combinaciones, Pascal, inclusión-exclusión"
  mod: "aritmética del reloj, congruencia, inverso modular"
  sum: "manipulación de Σ y sumas cerradas"

nodes:

