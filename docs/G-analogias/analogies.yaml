# Catálogo de analogías de Mathy. DATA, sin texto visible al usuario.
# Reglas y test de aceptación: G0-reglas.md. Textos: ../locales/<lang>/analogies.yaml
# bajo analogies.<id>.name y analogies.<id>.text.
#
# Campos:
#   id              snake_case; nombra el objeto o la situación, no el concepto
#   mechanic        una de las 12 de ../E-mecanicas/mechanics.yaml (el esqueleto)
#   target_nodes    nodos del grafo que pueden declarar analogy: <id>
#   structure_map   pares objeto -> concepto; el orden va de lo más visible a lo más fino
#   breaks_at       id corto del punto donde la analogía deja de preservar estructura (obligatorio)
#   fades_at_layer  capa a partir de la cual la analogía ya no aparece (enum layer del schema)
#   cultural_scope  universal | adaptable | local
#   variants        solo si adaptable/local: ids de variante por región
#   literacy_min    none | icons | short_text (nivel de lectura que exige la analogía en sí)
#   assets          ids de assets propios (nunca emojis de plataforma)

version: 1

analogies:

  # ───────────────────────────── found / arith ─────────────────────────────

  - id: sorting_bins
