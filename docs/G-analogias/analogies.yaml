      - bin: set
      - object: element
      - dropping_object_in_bin: membership_test
      - number_on_bin_label: cardinality
      - rearranging_objects_inside: bijection_invariance
    breaks_at: infinite_collections
    fades_at_layer: visual
    cultural_scope: universal
    literacy_min: none
    assets: [bin_round, bin_square, pebble, shell, leaf]

